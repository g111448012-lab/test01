function render(){ $('#nav1').classList.toggle('active',activity===1);$('#nav2').classList.toggle('active',activity===2);$('#shapeLabel').textContent=activity===1?names[shape()]:'？';$('#roundLabel').textContent=`${round+1} / 4`;$('#base').classList.toggle('on',base);$('#base').textContent=base?'◇ 收起底面':'◇ 顯示底面';$('#wire').textContent=wire?'◌ 隱藏虛線':'◌ 顯示虛線';$('#baseNote').textContent=base?'金色是本題指定的底面。':shape()===2?'按「顯示底面」看本題指定底面。':'';let html='';if(stage==='complete'){html=`${guide('完成啦！<br>你真會觀察！')}<div class="summary">方向變了，<br>頂點、邊、面的總數不變。</div><button class="primary" id="summary">查看本次紀錄</button><button class="option" id="again">再探索一次</button>`;}else if(activity===1){html=`${guide(stage==='predict'?'先猜一猜，<br>總共有幾個？':stage==='check'?'轉一轉，<br>一起找齊吧！':'你有什麼發現？')}`;
if(stage==='predict'){html+=`<p class="desc">猜猜${names[shape()]}的總數，<br>看不到的部分也要算。</p><div class="numfields">${['頂點','邊','面'].map((s,i)=>`<label>${s}<input id="p${i}" type="number" inputmode="numeric" min="0" max="30" value="${escape(predictionDraft[i])}" placeholder="?" aria-label="預測${s}總數"></label>`).join('')}</div><button class="primary" id="predict">猜好了，來查驗 →</button><p class="little-note">面＝底面＋側面</p>`;}else if(stage==='check'){html+=`<div class="prediction">首次預測｜${fmt(first)}</div><p class="desc" style="margin:12px 0 5px">選模式，再點圖形。<br>再點一次可取消標記。</p><div class="modes">${[['v','● 頂點'],['e','╱ 邊'],['f','⬡ 面']].map(([k,s])=>`<button data-mode="${k}" class="${mode===k?'active':''}">${s}</button>`).join('')}</div><div class="counts">${['頂點','邊','面'].map((s,i)=>`<div>${s}<strong>${count()[i]}</strong>已標記</div>`).join('')}</div><div class="feedback" role="status">${feedback}</div><button class="primary" id="check">數好了，查驗 →</button>`;}else{html+=`<div class="prediction">首次預測｜${fmt(first)}</div><p class="success">✓ 查驗結果｜${fmt(count())}</p><label class="label">原本漏掉哪裡？</label><textarea id="reflection" placeholder="例如：背面的頂點，或沒有漏掉。">${escape(reflectionValue)}</textarea><label class="label">轉一轉，總數會變嗎？</label><select id="invariant"><option value="">選擇你的想法</option><option value="no" ${invariantValue==='no'?'selected':''}>不會，還是同一個圖形</option><option value="yes" ${invariantValue==='yes'?'selected':''}>會，看到的部分變多了</option></select><div class="feedback" role="status">${feedback}</div><button class="primary" id="next">${round<3?'下一個立體 →':'換個方向試試看 →'}</button>`;}}
else{html+=`${guide(quizDone?'答對了！<br>換下一個試試。':'換個方向，<br>你還認得嗎？')}<p class="desc">選出名稱，再選判斷理由。</p><div>${names.map(n=>`<button data-choice="${n}" class="option ${choice===n?'active':''}" ${quizDone?'disabled':''}>${choice===n?'◉':'○'} ${n}</button>`).join('')}</div><select id="reason" ${quizDone?'disabled':''}><option value="">選擇判斷理由</option>${[['prism','有兩個全等且平行的底面'],['pyramid','側面都是連到同一尖頂的三角形'],['screen','尖尖的部分在螢幕上方']].map(([v,s])=>`<option value="${v}" ${reasonValue===v?'selected':''}>${s}</option>`).join('')}</select><div class="feedback ${quizDone?'success':''}" role="status">${feedback}</div><button class="primary" id="quiz">${quizDone?(round===3?'完成探索 →':'下一題 →'):'我選好了 →'}</button>`;}
if((activity===2||stage!=='predict')&&stage!=='complete'&&stage!=='reflect'&&!quizDone)html+=`<button class="hintbutton" id="hint">☼ ${hintLevel?'下一個提示':'給我提示'} ${hintLevel}/3</button>${hintLevel?`<div class="tipbox">${hintText()}</div>`:''}`;$('#task').innerHTML=html;bind();draw();}
function bind(){[0,1,2].forEach(i=>{if($('#p'+i))$('#p'+i).oninput=e=>{predictionDraft[i]=e.target.value;[0,1,2].forEach(j=>$('#p'+j).setCustomValidity(''));};});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render();});document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{reasonValue=$('#reason').value;choice=b.dataset.choice;render();});if($('#reason'))$('#reason').onchange=e=>reasonValue=e.target.value;if($('#reflection'))$('#reflection').oninput=e=>reflectionValue=e.target.value;if($('#invariant'))$('#invariant').onchange=e=>invariantValue=e.target.value;
if($('#predict'))$('#predict').onclick=()=>{let a=[0,1,2].map(i=>$('#p'+i).value);if(a.some(v=>v===''||!Number.isInteger(+v)||+v<0||+v>30)){[0,1,2].forEach(i=>$('#p'+i).setCustomValidity('請填入 0 到 30 的整數'));$('#p0').reportValidity();return;}first=a.map(Number);stage='check';render();};if($('#check'))$('#check').onclick=()=>{if(count().every((n,i)=>n===correct()[i])){stage='reflect';feedback='';}else{hintLevel=Math.max(1,hintLevel);if(!hints.includes(1))hints.push(1);feedback='還沒找齊喔，轉到背面看看！';}render();};if($('#hint'))$('#hint').onclick=hint;
if($('#next'))$('#next').onclick=()=>{if(!reflectionValue.trim()||!invariantValue){feedback='寫下發現，再選總數會不會變。';render();return;}if(invariantValue==='yes'){feedback='再看看：旋轉後，有增加或減少嗎？';hints.push('旋轉不變性提示');render();return;}records.push({activity:1,shape:names[shape()],first:[...first],final:count(),hints:[...hints],reflection:reflectionValue,invariant:invariantValue,rotations:rotationCount});if(round<3)round++;else{activity=2;round=0;delete drafts[2];}begin();};if($('#quiz'))$('#quiz').onclick=()=>{if(quizDone){if(round<3){round++;begin();}else{stage='complete';render();showRecords();}return;}if(!choice||!reasonValue){feedback='請選擇名稱與判斷理由。';render();return;}if(!firstQuiz)firstQuiz={name:choice,reason:reasonValue};let ok=choice===names[shape()]&&reasonValue===(shape()<2?'prism':'pyramid');if(ok){quizDone=true;feedback='✓ 答對了！方向變了，名稱不變。';records.push({activity:2,shape:names[shape()],first:{...firstQuiz},final:{name:choice,reason:reasonValue},hints:[...hints],rotations:rotationCount});}else{hintLevel=Math.max(hintLevel,1);if(!hints.includes(1))hints.push(1);feedback='再找找底面，看看側面怎麼連。';}render();};if($('#summary'))$('#summary').onclick=showRecords;if($('#again'))$('#again').onclick=()=>{activity=1;round=0;drafts={};begin();};}
$('#reset').onclick=()=>{[rx,ry]=pose();draw();};$('#base').onclick=()=>{base=!base;if(base&&!hints.includes('自行標示底面'))hints.push('自行標示底面');render();};$('#wire').onclick=()=>{wire=!wire;render();};document.querySelectorAll('[data-rot]').forEach(b=>b.onclick=()=>{let r=b.dataset.rot;if(r==='left')ry-=.35;if(r==='right')ry+=.35;if(r==='up')rx-=.35;if(r==='down')rx+=.35;rotationCount++;draw();});function switchActivity(next){if(activity===next)return;drafts[activity]={round,stage,mode,marked,rx,ry,base,wire,first,hints,feedback,hintLevel,rotationCount,choice,firstQuiz,quizDone,reasonValue,reflectionValue,invariantValue,predictionDraft};activity=next;if(drafts[next]){({round,stage,mode,marked,rx,ry,base,wire,first,hints,feedback,hintLevel,rotationCount,choice,firstQuiz,quizDone,reasonValue,reflectionValue,invariantValue,predictionDraft}=drafts[next]);render();}else{round=0;begin();}}$('#nav1').onclick=()=>switchActivity(1);$('#nav2').onclick=()=>switchActivity(2);
const reasons={prism:'兩底面全等且平行',pyramid:'三角形側面連到同一尖頂',screen:'以螢幕上下方向判斷'};function showRecords(){let pending=stage!=='complete'&&!quizDone&&(first||firstQuiz)?`<div class="summary">本題進行中：${escape(names[shape()])}<br>首次答案：${first?fmt(first):escape(firstQuiz.name)+'／'+escape(reasons[firstQuiz.reason])}<br>目前${activity===1?'標記':'選擇'}：${activity===1?fmt(count()):escape(choice)}<br>提示：${escape(hints.join('、')||'未使用')}<br>尚未完成，未列為最後答案。</div>`:'';$('#recordBody').innerHTML=pending+(records.length?`<table><thead><tr><th>活動／形體</th><th>首次答案</th><th>最後答案</th><th>提示／觀察</th></tr></thead><tbody>${records.map(r=>`<tr><td>${r.activity===1?'先猜再查':'換個方向'}<br>${r.shape}</td><td>${r.activity===1?fmt(r.first):escape(r.first.name)+'<br>'+escape(reasons[r.first.reason])}</td><td>${r.activity===1?fmt(r.final):escape(r.final.name)+'<br>'+escape(reasons[r.final.reason])}</td><td>${escape(r.hints.join('、')||'未使用提示')}<br>旋轉操作 ${r.rotations} 次${r.reflection?'<br>觀察：'+escape(r.reflection)+'<br>總數不變：已確認':''}</td></tr>`).join('')}</tbody></table>`:'<p>尚無已完成的題目。完成一題後，這裡會保留首次與最後答案。</p>')+'<p>提示 1＝旋轉觀察；2＝標示底面；3＝示範計數／判斷。教師可根據口語說明補充觀察，不宜只以數量差異判定迷思。</p>';$('#records').showModal();}
$('#closeRecords').onclick=()=>$('#records').close();$('#export').onclick=()=>{const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify({version:1,completed:records,inProgress:stage==='complete'||quizDone?null:{activity,shape:names[shape()],first:first||firstQuiz,current:activity===1?count():{name:choice,reason:reasonValue},hints,reflection:reflectionValue}},null,2)],{type:'application/json'}));a.href=url;a.download='立體探索紀錄.json';a.click();URL.revokeObjectURL(url);};window.addEventListener('resize',draw);begin();
</script></body></html>
